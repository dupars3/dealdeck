<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Poker Tool</title>
<style>
body {
  margin:0; padding:16px; background:#000;
  font-family:system-ui,sans-serif; color:#fff;
  display:flex; flex-direction:column; align-items:center;
}
#counter { font-size:28px; text-align:center; width:100%; max-width:600px; margin-bottom:40px; }
.separator { color:#666; }
.table-container {
  display:flex; flex-direction:column; align-items:center;
  gap:40px; width:100%; max-width:1024px;
  transform:scale(1); transform-origin:top center;
}
#board { display:flex; gap:12px; justify-content:center; width:100%; max-width:600px; }
.hands-row { display:flex; gap:60px; justify-content:center; width:100%; max-width:600px; }
.player-cards { display:flex; gap:12px; }
.controls-wrapper { display:flex; flex-direction:column; align-items:center; gap:16px; margin-top:40px; }
.controls-row { display:flex; gap:12px; align-items:center; }
.card {
  width:120px; height:150px; border-radius:12px; background:#fff; color:#000;
  display:flex; justify-content:center; align-items:center;
  font-weight:700; font-size:36px; box-shadow:0 4px 8px rgba(0,0,0,0.3);
}
.card.back {
  background-color:#b74b4b;
  background-image:
    repeating-linear-gradient(45deg,rgba(255,255,255,0.07),rgba(255,255,255,0.07) 2px,transparent 2px,transparent 10px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,0.07),rgba(255,255,255,0.07) 2px,transparent 2px,transparent 10px);
  color:transparent;
}
.card.deal { opacity:0; transform:translateY(-20px); animation:drop 0.7s forwards; }
@keyframes drop { to { opacity:1; transform:translateY(0); } }
button, input {
  width:140px; height:70px; font-size:20px; border-radius:10px; border:none;
  box-sizing:border-box; text-align:center; font-weight:700; color:#fff;
  cursor:pointer; transition:transform 0.1s, filter 0.1s, opacity 0.1s;
  touch-action: manipulation;
}
button:not(:disabled):hover { filter:brightness(1.1); transform:translateY(-2px); }
button:disabled { opacity:0.4; cursor:not-allowed; filter:grayscale(40%); transform:none; }
input { background:#222; color:#fff; padding:0 10px; }
input:disabled { opacity:0.4; cursor:not-allowed; filter:grayscale(40%); }
#clear { background:#3FAE8E; }
#dealHero { background:#4DA6FF; }
#dealFlop, #dealTurn, #dealRiver { background:#FFAA33; }

/* ── Card Picker Modal ── */
#pickerOverlay {
  display:none; position:fixed; inset:0; z-index:1000;
  background:rgba(0,0,0,0.85);
  align-items:flex-end; justify-content:center;
  touch-action:none;
}
#pickerOverlay.open { display:flex; }
#pickerPanel {
  background:#1a1a1a; border-radius:20px 20px 0 0;
  width:100%; max-width:500px;
  padding:16px 12px 0px;
  max-height:92dvh; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  box-sizing:border-box;
}
#pickerTitle {
  font-size:18px; font-weight:700; text-align:center;
  margin:0 0 4px; color:#fff;
}
#pickerSubtitle {
  font-size:13px; text-align:center; color:#aaa;
  margin:0 0 12px;
}

/* Selected cards tray */
#pickerSelected {
  display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
  min-height:50px; margin-bottom:14px;
  padding:6px 8px; background:#111; border-radius:10px;
  align-items:center;
}
.sel-card {
  background:#fff; border-radius:6px;
  font-size:16px; font-weight:700; padding:5px 9px;
  display:flex; align-items:center; gap:4px; cursor:pointer;
  line-height:1;
}
.sel-card .remove { color:#c00; font-size:11px; margin-left:2px; }
.sel-placeholder { color:#555; font-size:13px; }

/* Step indicator */
#stepIndicator {
  display:flex; align-items:center; justify-content:center;
  gap:8px; margin-bottom:12px;
}
.step-pill {
  padding:4px 14px; border-radius:20px; font-size:13px; font-weight:700;
  background:#2a2a2a; color:#888;
}
.step-pill.active { background:#FFAA33; color:#fff; }
.step-pill.done   { background:#3a3a3a; color:#aaa; }
.step-arrow { color:#555; font-size:14px; }

/* Rank grid (shown in step 1) */
#rankGrid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  margin-bottom:6px;
}
.rank-btn {
  aspect-ratio:1; border-radius:8px; border:2px solid transparent;
  font-size:20px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  width:100%; height:62px;
  background:#2a2a2a; color:#fff;
  transition:opacity 0.15s, transform 0.1s, border-color 0.15s;
  touch-action:manipulation;
}
.rank-btn.active-rank  { border-color:#4DA6FF; background:#1a3a5c; color:#4DA6FF; }
.rank-btn:not(.active-rank):not(:disabled):active { transform:scale(0.93); }

/* Suit grid (shown in step 2) */
#suitGrid {
  display:grid; grid-template-columns:repeat(2,1fr); gap:8px;
  margin-bottom:6px; max-width:320px; margin-left:auto; margin-right:auto;
}
.suit-btn {
  border-radius:10px; border:2px solid transparent;
  font-size:28px; font-weight:700; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:14px 0; background:#2a2a2a;
  transition:opacity 0.15s, transform 0.1s, border-color 0.15s;
  touch-action:manipulation;
  gap:4px;
}
.suit-btn .suit-label { font-size:12px; font-weight:700; margin-top:2px; }
.suit-btn.dealt { opacity:0.22; cursor:not-allowed; filter:grayscale(60%); }
.suit-btn:not(.dealt):active { transform:scale(0.93); }

/* Back button for step 2 */
#stepBackBtn {
  width:100%; height:40px; border-radius:8px; border:none;
  background:#2a2a2a; color:#aaa; font-size:14px; font-weight:600;
  cursor:pointer; margin-bottom:10px; touch-action:manipulation;
}
#stepBackBtn:hover { background:#333; color:#fff; }

#pickerActions { padding-bottom:80px;
  display:flex; gap:10px; margin-top:14px;
}
#pickerCancel, #pickerConfirm {
  flex:1; height:54px; border-radius:10px; border:none;
  font-size:18px; font-weight:700; cursor:pointer;
  touch-action:manipulation;
}
#pickerCancel  { background:#333; color:#fff; }
#pickerConfirm { background:#FFAA33; color:#fff; }
#pickerConfirm:disabled { opacity:0.4; cursor:not-allowed; }

@media (max-width:600px){
  body {
    padding:8px; padding-top:20px;
    min-height:100dvh; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    justify-content:flex-start;
  }
  #counter { font-size:20px; font-weight:600; margin-bottom:40px; margin-top:12px; padding:0 4px; }
  .table-container { gap:40px; margin-bottom:60px; }
  #board { gap:5px; }
  .hands-row { gap:20px; }
  .player-cards { gap:5px; }
  .card { width:17.5vw; height:22vw; font-size:6vw; border-radius:8px; }
  .controls-wrapper { margin-top:40px; gap:12px; width:100%; align-items:center; }
  .controls-row { gap:8px; flex-wrap:wrap; justify-content:center; width:100%; }
  button, input { width:31%; min-width:90px; height:75px; font-size:18px; border-radius:8px; }
  #rankGrid { grid-template-columns:repeat(4,1fr); gap:8px; }
  .rank-btn { height:62px; font-size:18px; }
  .suit-btn { font-size:24px; padding:10px 0; }
}
@media (min-width:601px){
  .table-container { transform:scale(0.8); }
}
</style>
</head>
<body>

<div id="counter">
  Flop 0 <span class="separator">|</span> Turn 0
  <span class="separator">|</span> River 0
  <span class="separator">|</span> Left 52
</div>

<div class="table-container">
  <div id="board"></div>
  <div class="hands-row">
    <div id="villain" class="player-cards"></div>
    <div id="hero" class="player-cards"></div>
  </div>
  <div class="controls-wrapper">
    <div class="controls-row">
      <button id="clear">Clear</button>
      <button id="dealHero" style="line-height:1.2;">Deal<br>Hero</button>
      <button id="setHeroBtn" style="background:#2255aa;line-height:1.2;">Set<br>Hero</button>
    </div>
    <div class="controls-row">
      <button id="dealFlop" style="line-height:1.2;">Deal<br>Flop</button>
      <button id="dealTurn" disabled style="line-height:1.2;">Deal<br>Turn</button>
      <button id="dealRiver" disabled style="line-height:1.2;">Deal<br>River</button>
    </div>
    <div class="controls-row">
      <button id="setFlopBtn" style="background:#996600;line-height:1.2;">Set<br>Flop</button>
      <button id="setTurnBtn" style="background:#996600;line-height:1.2;" disabled>Set<br>Turn</button>
      <button id="setRiverBtn" style="background:#996600;line-height:1.2;" disabled>Set<br>River</button>
    </div>
  </div>
</div>

<!-- Card Picker Modal -->
<div id="pickerOverlay">
  <div id="pickerPanel">
    <div id="pickerTitle">Select Cards</div>
    <div id="pickerSubtitle">Tap a rank, then choose a suit</div>

    <div id="pickerSelected"><span class="sel-placeholder">No cards selected</span></div>

    <div id="stepIndicator">
      <span class="step-pill active" id="step1pill">1 · Rank</span>
      <span class="step-arrow">›</span>
      <span class="step-pill" id="step2pill">2 · Suit</span>
    </div>

    <!-- Step 1: rank grid -->
    <div id="rankGrid"></div>

    <!-- Step 2: suit grid (hidden until rank picked) -->
    <button id="stepBackBtn" style="display:none;">← Back to ranks</button>
    <div id="suitGrid" style="display:none;"></div>

    <div id="pickerActions">
      <button id="pickerCancel">Cancel</button>
      <button id="pickerConfirm" disabled>Confirm</button>
    </div>
  </div>
</div>

<script>
(() => {
  const ranks     = ['A','K','Q','J','10','9','8','7','6','5','4','3','2'];
  const suitKeys  = ['S','H','D','C'];
  const suitSym   = { S:'♠', H:'♥', D:'♦', C:'♣' };
  const suitLabel = { S:'Spades', H:'Hearts', D:'Diamonds', C:'Clubs' };
  const suitColor = { S:'#ffffff', H:'#ff5555', D:'#4DA6FF', C:'#66dd66' };

  function buildDeck(){
    const d=[];
    for(const r of ranks) for(const s of suitKeys) d.push(r+s);
    return d;
  }
  function shuffle(d){
    for(let i=d.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [d[i],d[j]]=[d[j],d[i]];
    }
  }
  function cardDisplay(code){
    return code.slice(0,-1) + suitSym[code.slice(-1)];
  }

  let deck=[], hero=[], board=[null,null,null,null,null];
  let counters={flop:0,turn:0,river:0};

  const heroEl    = document.getElementById('hero');
  const villainEl = document.getElementById('villain');
  const boardEl   = document.getElementById('board');
  const counterEl = document.getElementById('counter');
  const heroBtn    = document.getElementById('dealHero');
  const flopBtn    = document.getElementById('dealFlop');
  const turnBtn    = document.getElementById('dealTurn');
  const riverBtn   = document.getElementById('dealRiver');
  const setHeroBtn  = document.getElementById('setHeroBtn');
  const setFlopBtn  = document.getElementById('setFlopBtn');
  const setTurnBtn  = document.getElementById('setTurnBtn');
  const setRiverBtn = document.getElementById('setRiverBtn');

  function cardNode(code, newDeal=false){
    const d=document.createElement('div');
    d.className='card'+(newDeal?' deal':'');
    const s=code.slice(-1);
    const sc=(s==='H'||s==='D')?'#cc0000':'#000';
    d.innerHTML=`<span style="color:#000">${code.slice(0,-1)}</span><span style="color:${sc}">${suitSym[s]}</span>`;
    return d;
  }
  function backNode(newDeal=false){
    const d=document.createElement('div');
    d.className='card back'+(newDeal?' deal':'');
    return d;
  }

  function updateButtons(){
    const flopDealt = board[0]!==null;
    const turnDealt = board[3]!==null;
    const rivDealt  = board[4]!==null;

    // Hero buttons: if no flop, deck resets to 52 so always enough cards.
    // If flop is dealt, must have at least 2 cards left in the existing deck.
    const heroBlocked = flopDealt && deck.length < 2;
    heroBtn.disabled    = heroBlocked;
    setHeroBtn.disabled = heroBlocked;
    flopBtn.disabled     = turnDealt || deck.length<3;
    setFlopBtn.disabled  = turnDealt || deck.length<3;
    turnBtn.disabled     = !flopDealt || rivDealt || deck.length<1;
    setTurnBtn.disabled  = !flopDealt || rivDealt || deck.length<1;
    riverBtn.disabled    = !turnDealt || deck.length<1;
    setRiverBtn.disabled = !turnDealt || deck.length<1;
  }

  function updateCounter(){
    counterEl.innerHTML =
      `Flop ${counters.flop} <span class="separator">|</span> Turn ${counters.turn} <span class="separator">|</span> River ${counters.river} <span class="separator">|</span> Left ${deck.length}`;
  }

  function draw(newHero=false, newFlop=[], newTurn=false, newRiver=false){
    heroEl.innerHTML='';
    hero.forEach(c=>heroEl.appendChild(cardNode(c,newHero)));
    while(heroEl.children.length<2) heroEl.appendChild(backNode());

    boardEl.innerHTML='';
    board.forEach((c,i)=>{
      const n=(i<3&&newFlop.includes(c))||(i===3&&newTurn)||(i===4&&newRiver);
      boardEl.appendChild(c?cardNode(c,n):backNode());
    });

    villainEl.innerHTML='';
    villainEl.appendChild(backNode());
    villainEl.appendChild(backNode());

    updateButtons();
    updateCounter();
  }

  function deal(n,t,s=0){
    const out=[];
    for(let i=0;i<n;i++){
      if(!deck.length) return out;
      t[s+i]=deck.shift();
      out.push(t[s+i]);
    }
    return out;
  }

  // Returns true if a flop has been dealt
  function flopDealt(){ return board[0]!==null; }

  // Reset deck to fresh 52, remove board cards and hero cards from it
  function resetDeckAroundCurrentState(){
    deck=buildDeck(); shuffle(deck);
    // Remove any board cards already dealt
    board.forEach(c=>{ if(c){ const i=deck.indexOf(c); if(i>-1) deck.splice(i,1); } });
    // Hero cards will be removed separately after being chosen
  }

  // ── Picker state ──
  let pickerMode     = null;
  let pickerMax      = 2;
  let pickerSelected = [];   // confirmed codes e.g. ["AS","KH"]
  let pendingRank    = null; // rank chosen in step 1, waiting for suit

  const overlay      = document.getElementById('pickerOverlay');
  const pickerTitle  = document.getElementById('pickerTitle');
  const pickerSub    = document.getElementById('pickerSubtitle');
  const pickerSelDiv = document.getElementById('pickerSelected');
  const rankGrid     = document.getElementById('rankGrid');
  const suitGrid     = document.getElementById('suitGrid');
  const stepBackBtn  = document.getElementById('stepBackBtn');
  const step1pill    = document.getElementById('step1pill');
  const step2pill    = document.getElementById('step2pill');
  const cancelBtn    = document.getElementById('pickerCancel');
  const confirmBtn   = document.getElementById('pickerConfirm');

  function dealtSet(){
    const full=buildDeck();
    const s=new Set(full.filter(c=>!deck.includes(c)));
    // remove currently-in-picker selections so they don't grey themselves
    pickerSelected.forEach(c=>s.delete(c));
    return s;
  }

  function renderTray(){
    pickerSelDiv.innerHTML='';
    if(pickerSelected.length===0){
      const p=document.createElement('span');
      p.className='sel-placeholder';
      p.textContent='No cards selected';
      pickerSelDiv.appendChild(p);
    } else {
      pickerSelected.forEach(code=>{
        const s=code.slice(-1);
        const el=document.createElement('div');
        el.className='sel-card';
        el.style.color=(s==='H'||s==='D')?'#cc0000':'#000';
        el.innerHTML=`${cardDisplay(code)}<span class="remove"> ✕</span>`;
        el.onclick=()=>removeFromTray(code);
        pickerSelDiv.appendChild(el);
      });
    }
    confirmBtn.disabled = pickerSelected.length !== pickerMax;
  }

  function removeFromTray(code){
    pickerSelected=pickerSelected.filter(c=>c!==code);
    renderTray();
    showStep1();
  }

  // ── Step 1: show rank grid ──
  function showStep1(){
    pendingRank=null;
    rankGrid.style.display='grid';
    suitGrid.style.display='none';
    stepBackBtn.style.display='none';
    step1pill.className='step-pill active';
    step2pill.className='step-pill';

    const dealt=dealtSet();
    rankGrid.innerHTML='';
    ranks.forEach(r=>{
      const btn=document.createElement('button');
      btn.className='rank-btn';
      btn.textContent=r;
      // Highlight if all suits available (not all dealt), dim if all 4 suits already dealt
      const allDealt=suitKeys.every(s=>dealt.has(r+s)&&!pickerSelected.includes(r+s));
      if(allDealt){ btn.disabled=true; btn.style.opacity='0.22'; btn.style.filter='grayscale(60%)'; }
      btn.onclick=()=>{ pendingRank=r; showStep2(r); };
      rankGrid.appendChild(btn);
    });
  }

  // ── Step 2: show suit grid for chosen rank ──
  function showStep2(rank){
    rankGrid.style.display='none';
    suitGrid.style.display='grid';
    stepBackBtn.style.display='block';
    step1pill.className='step-pill done';
    step2pill.className='step-pill active';

    const dealt=dealtSet();
    suitGrid.innerHTML='';
    suitKeys.forEach(s=>{
      const code=rank+s;
      const btn=document.createElement('button');
      btn.className='suit-btn';
      btn.style.color=suitColor[s];
      btn.innerHTML=`<span style="font-size:32px">${suitSym[s]}</span><span class="suit-label" style="color:${suitColor[s]}">${suitLabel[s]}</span>`;

      const isDealt=dealt.has(code);
      const alreadySel=pickerSelected.includes(code);

      if(isDealt||alreadySel){
        btn.classList.add('dealt');
        btn.disabled=true;
        const lbl=btn.querySelector('.suit-label');
        if(lbl) lbl.textContent='Already chosen';
      } else {
        btn.onclick=()=>{
          if(pickerSelected.length>=pickerMax) return;
          pickerSelected.push(code);
          renderTray();
          showStep1();
        };
      }
      suitGrid.appendChild(btn);
    });
  }

  stepBackBtn.onclick=()=>showStep1();

  cancelBtn.onclick=()=>closePicker();

  overlay.addEventListener('click',e=>{ if(e.target===overlay) closePicker(); });

  // ── Confirm: apply selections to game state ──
  confirmBtn.onclick=()=>{
    if(pickerSelected.length!==pickerMax) return;
    const chosen=pickerSelected.slice();
    const mode=pickerMode;   // capture BEFORE closing
    closePicker();

    if(mode==='hero'){
      // If no flop dealt, reset to a fresh deck first (removes board cards too, but board is empty)
      if(!flopDealt()){
        deck=buildDeck(); shuffle(deck);
      }
      hero=[];
      chosen.forEach(c=>{ const i=deck.indexOf(c); if(i>-1) deck.splice(i,1); hero.push(c); });
      draw(true);
    } else if(mode==='flop'){
      // If no hero cards, reset to a fresh deck before applying the flop
      if(hero.length===0){
        deck=buildDeck(); shuffle(deck);
      }
      board.fill(null,0,3);
      chosen.forEach((c,i)=>{ deck.splice(deck.indexOf(c),1); board[i]=c; });
      counters.flop++;
      draw(false,chosen);
    } else if(mode==='turn'){
      deck.splice(deck.indexOf(chosen[0]),1);
      board[3]=chosen[0];
      counters.turn++;
      draw(false,[],true);
    } else if(mode==='river'){
      deck.splice(deck.indexOf(chosen[0]),1);
      board[4]=chosen[0];
      counters.river++;
      draw(false,[],false,true);
    }
  };

  function openPicker(mode){
    // Hero (no flop): fresh deck so picker shows all 52 available
    if(mode==='hero' && !flopDealt()){
      deck=buildDeck(); shuffle(deck);
    }
    // Flop (no hero): fresh deck so picker shows all 52 available
    if(mode==='flop' && hero.length===0){
      deck=buildDeck(); shuffle(deck);
    }
    pickerMode=mode;
    pickerSelected=[];
    pendingRank=null;
    if(mode==='hero'){
      pickerMax=2; pickerTitle.textContent='Set Hero Hand';
      pickerSub.textContent='Pick rank → suit for each card (need 2)';
    } else if(mode==='flop'){
      pickerMax=3; pickerTitle.textContent='Set Flop';
      pickerSub.textContent='Pick rank → suit for each card (need 3)';
    } else if(mode==='turn'){
      pickerMax=1; pickerTitle.textContent='Set Turn';
      pickerSub.textContent='Pick a rank then its suit';
    } else if(mode==='river'){
      pickerMax=1; pickerTitle.textContent='Set River';
      pickerSub.textContent='Pick a rank then its suit';
    }
    renderTray();
    showStep1();
    overlay.classList.add('open');
    document.body.style.overflow='hidden';
  }

  function closePicker(){
    overlay.classList.remove('open');
    document.body.style.overflow='';
    pickerMode=null;
    pickerSelected=[];
    pendingRank=null;
  }

  setHeroBtn.onclick  = ()=>openPicker('hero');
  setFlopBtn.onclick  = ()=>openPicker('flop');
  setTurnBtn.onclick  = ()=>openPicker('turn');
  setRiverBtn.onclick = ()=>openPicker('river');

  // Hero random deal: reset deck if no flop, then deal 2
  heroBtn.onclick = ()=>{
    if(!flopDealt()){
      deck=buildDeck(); shuffle(deck);
    }
    hero=[];
    deal(2,hero);
    draw(true);
  };

  flopBtn.onclick  = ()=>{
    if(hero.length===0){ deck=buildDeck(); shuffle(deck); }
    board.fill(null,0,3); const f=deal(3,board,0); counters.flop++; draw(false,f);
  };
  turnBtn.onclick  = ()=>{ board[3]=null; deal(1,board,3); counters.turn++; draw(false,[],true); };
  riverBtn.onclick = ()=>{ board[4]=null; deal(1,board,4); counters.river++; draw(false,[],false,true); };

  document.getElementById('clear').onclick = ()=>{
    deck=buildDeck(); shuffle(deck);
    hero=[]; board=[null,null,null,null,null];
    counters={flop:0,turn:0,river:0};
    draw();
  };

  deck=buildDeck(); shuffle(deck); draw();
})();
</script>
</body>
</html>
